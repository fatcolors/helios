<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Helios Atelier — Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Krona+One&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .col-detail {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .col-hero {
      position: relative;
      height: clamp(420px, 60vh, 680px);
      overflow: hidden;
      flex-shrink: 0;
    }

    .col-hero__img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform: scale(1.04);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .col-hero__img.is-loaded {
      transform: scale(1);
    }

    .col-hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        0deg,
        rgba(0,0,0,0.82) 0%,
        rgba(0,0,0,0.45) 40%,
        rgba(0,0,0,0.15) 100%
      );
    }

    .col-hero__back {
      position: absolute;
      top: calc(72px + 1.25rem);
      left: clamp(1.25rem, 3vw, 2.5rem);
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.6rem;
      height: 2.6rem;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      backdrop-filter: blur(6px);
      background: rgba(0,0,0,0.18);
      transition: border-color 0.22s ease, color 0.22s ease, background 0.22s ease;
    }

    .col-hero__back:hover {
      border-color: rgba(255,255,255,0.7);
      color: #fff;
      background: rgba(0,0,0,0.35);
    }

    .col-hero__back svg {
      transition: transform 0.22s ease;
    }

    .col-hero__back:hover svg {
      transform: translateX(-2px);
    }

    .col-hero__content {
      position: absolute;
      bottom: clamp(2rem, 5vw, 4rem);
      left: clamp(1.5rem, 6vw, 6rem);
      right: clamp(1.5rem, 6vw, 6rem);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .col-hero__content.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .col-hero__number {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .col-hero__title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.1;
      color: #fff;
      margin: 0 0 1.5rem;
    }

    .col-hero__title .text-gold {
      color: var(--color-gold-light);
    }

    .col-hero__meta {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .col-hero__meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .col-hero__meta-label {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .col-hero__meta-value {
      font-size: 0.85rem;
      font-weight: 300;
      color: rgba(255,255,255,0.9);
    }

    .col-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(2rem, 5vw, 5rem);
      padding: clamp(2.5rem, 5vw, 5rem) clamp(1.5rem, 6vw, 6rem);
      max-width: 1200px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.65s ease 0.25s, transform 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s;
    }

    .col-body.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .col-body__back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      text-decoration: none;
      margin-bottom: 2.5rem;
      transition: color 0.2s ease;
    }

    .col-body__back:hover { color: var(--color-gold); }

    .col-body__back svg { transition: transform 0.2s ease; }
    .col-body__back:hover svg { transform: translateX(-3px); }

    .col-body__label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: 1.25rem;
    }

    .col-body__desc {
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 1.6vw, 1.35rem);
      font-weight: 400;
      line-height: 1.7;
      color: #2a2a2a;
    }

    .col-body__aside { padding-top: 3.8rem; }

    .col-body__details {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid rgba(0,0,0,0.07);
    }

    .col-body__detail {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.07);
    }

    .col-body__detail-key {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #bbb;
    }

    .col-body__detail-val {
      font-size: 0.85rem;
      font-weight: 300;
      color: #333;
      text-align: right;
    }

    .col-body__cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2.5rem;
      padding: 0.85rem 1.75rem;
      background: transparent;
      border: 1px solid #2a2a2a;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2a2a2a;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .col-body__cta:hover {
      background: #2a2a2a;
      color: #fff;
    }

    @media (max-width: 768px) {
      .col-body {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .col-body__aside { padding-top: 0; }
    }
  </style>

  <script>
    const hamburger = document.querySelector('.nav__hamburger');
    const mobileMenu = document.querySelector('.mobile-menu');
    function closeMenu() {
      hamburger.classList.remove('is-active');
      mobileMenu.classList.remove('is-open');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('menu-open');
    }
    if (hamburger && mobileMenu) {
      hamburger.addEventListener('click', () => {
        const isOpen = hamburger.classList.toggle('is-active');
        mobileMenu.classList.toggle('is-open');
        hamburger.setAttribute('aria-expanded', isOpen);
        document.body.classList.toggle('menu-open', isOpen);
      });
      const closeBtn = mobileMenu.querySelector('.mobile-menu__close');
      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    }
